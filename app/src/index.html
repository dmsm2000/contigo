<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <title>Conti·GO</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Um sítio novo por mês, a dois." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Conti·GO" />
    <!-- Na app instalada no iPhone, "default" (e "black", que o iOS trata igual) dá uma barra de estado sempre branca,
         mesmo no tema escuro. Com "black-translucent" a página desenha por baixo dela e pinta essa faixa com a cor
         do tema (ver body::after em styles.scss). O iOS guarda isto quando se instala a app no ecrã principal. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>A Conti·GO precisa de JavaScript para funcionar.</noscript>
  </body>
</html>
