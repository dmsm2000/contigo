    <style>
      /* Splash: aparece logo no primeiro desenho, antes de o Angular arrancar, e some quando a app está pronta. */
      #splash {
        position: fixed;
        /* Sobra para lá do ecrã em cima e em baixo: no iPhone a zona do indicador de início (em baixo) ficava de fora e deixava ver o fundo branco. */
        inset: -120px 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #1b1620;
        transition: opacity 0.3s ease;
      }
      #splash.dark {
        background: #0e0c11;
        color: #f4eef1;
      }
      /* Antes de o script correr (ou sem ele), segue o tema do telemóvel: nunca um clarão branco no escuro. */
      @media (prefers-color-scheme: dark) {
        html, body { background: #0e0c11; }
        #splash:not(.light) { background: #0e0c11; color: #f4eef1; }
      }
      /* Na app instalada o iOS mostra primeiro a imagem de arranque (escura): o primeiro desenho da página já é escuro e igual,
         sem esperar por nenhum script. O ícone vai dentro do próprio HTML (data:) para aparecer no mesmo desenho que o fundo. */
      @media (display-mode: standalone) {
        html, body { background: #0e0c11; }
        #splash { background: #0e0c11; color: #ffffff; }
        #splash img { box-shadow: none; }
        #splash small { opacity: 1; color: #a39ba8; }
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      /* Mesmas proporções da imagem de arranque do iOS (scripts/make-splash.sh): 30% da largura o ícone, 11% o nome, 4% a legenda.
         Assim, quando a página toma o lugar da imagem, nada se mexe. O limite (px) só vale em ecrãs largos. */
      #splash { gap: 0; }
      #splash img {
        width: min(30vw, 144px);
        height: min(30vw, 144px);
        border-radius: min(6.6vw, 32px);
        box-shadow: 0 14px 40px rgba(194, 48, 111, 0.28);
      }
      #splash b {
        margin-top: min(6vw, 28px);
        font: 700 min(11vw, 50px) / 1 -apple-system, system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      #splash b i {
        font-style: normal;
        background: linear-gradient(135deg, #c2306f, #ee5a62 55%, #f7a55a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #splash small {
        margin-top: min(4vw, 18px);
        font: 500 min(4vw, 18px) / 1 -apple-system, system-ui, sans-serif;
        letter-spacing: 0.22em;
        opacity: 0.55;
      }
      /* Na app instalada o iOS já mostrou a imagem de arranque (escura): a página fica igual a ela, parada, e só depois some. */
      #splash.still { background: #0e0c11; color: #ffffff; }
      #splash.still img { box-shadow: none; }
      #splash.still small { opacity: 1; color: #a39ba8; }
    </style>

    <script>
      // Mesmo tema da app (o que está guardado, ou o do telemóvel), para não piscar branco no escuro.
      try {
        var pref = localStorage.getItem('contigo.theme') || 'system';
        var dark = pref.indexOf('dark') > -1 || (pref.indexOf('light') === -1 && matchMedia('(prefers-color-scheme: dark)').matches);
        // Na app instalada (iOS) o sistema já mostrou a imagem de arranque, que é sempre escura: continua igual, sem animação.
        var installed = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
        if (installed) {
          dark = true;
          // No iOS a altura que a página vê no primeiro desenho não é a final (o splash nascia ~25px mais acima e depois descia).
          // A altura do ecrã não muda: com ela fixa, o splash fica no centro exato, onde a imagem de arranque tem o logótipo.
          if (innerHeight >= innerWidth) {
            var box = document.getElementById('splash').style;
            box.top = '0'; box.bottom = 'auto'; box.height = screen.height + 'px';
          }
        }
        document.getElementById('splash').className = (dark ? 'dark' : 'light') + (installed ? ' still' : '');
        document.documentElement.style.background = document.body.style.background = dark ? '#0e0c11' : '#ffffff';
      } catch (e) {}
    </script>
