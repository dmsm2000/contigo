<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <title>Conti·GO</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Um sítio novo por mês, a dois." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Conti·GO" />
    <!-- Na app instalada no iPhone, "default" (e "black", que o iOS trata igual) dá uma barra de estado sempre branca,
         mesmo no tema escuro. Com "black-translucent" a página desenha por baixo dela e pinta essa faixa com a cor
         do tema (ver body::after em styles.scss). O iOS guarda isto quando se instala a app no ecrã principal. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Splash: aparece logo no primeiro desenho, antes de o Angular arrancar, e some quando a app está pronta. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #1b1620;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #splash.dark {
        background: #0e0c11;
        color: #f4eef1;
      }
      #splash.out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #splash img {
        width: 96px;
        height: 96px;
        border-radius: 26px;
        box-shadow: 0 14px 40px rgba(194, 48, 111, 0.28);
        animation: splash-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #splash b {
        font: 700 30px/1 system-ui, -apple-system, sans-serif;
        letter-spacing: -0.02em;
        animation: splash-rise 0.6s 0.15s ease both;
      }
      #splash b i {
        font-style: normal;
        background: linear-gradient(135deg, #c2306f, #ee5a62 55%, #f7a55a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #splash small {
        font: 500 13px/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.32em;
        opacity: 0.55;
        animation: splash-rise 0.6s 0.3s ease both;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash b, #splash small { animation: none; }
        #splash { transition: opacity 0.2s ease; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="A abrir a Conti·GO">
      <img src="icons/icon-192x192.png" alt="" width="96" height="96" />
      <b>Conti<i>·GO</i></b>
      <small>PÃO E CEBOLA</small>
    </div>
    <script>
      // Mesmo tema da app (o que está guardado, ou o do telemóvel), para não piscar branco no escuro.
      try {
        var pref = localStorage.getItem('contigo.theme') || 'system';
        var dark = pref.indexOf('dark') > -1 || (pref.indexOf('light') === -1 && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.getElementById('splash').className = 'dark';
      } catch (e) {}
    </script>
    <app-root></app-root>
    <noscript>A Conti·GO precisa de JavaScript para funcionar.</noscript>
  </body>
</html>
