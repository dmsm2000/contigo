<ion-content>
  <div class="sheet">
    <header class="head">
      <h1 class="ct-display title">{{ (idea ? 'ideas.form.editTitle' : 'ideas.form.title') | transloco }}</h1>
      <button class="ct-icon-btn" type="button" (click)="close()" [attr.aria-label]="'common.close' | transloco">
        <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <form id="idea-form" (ngSubmit)="save()" novalidate>
      <section class="block ct-rise" style="--i: 0">
        <label class="label" for="idea-body">{{ 'ideas.form.label' | transloco }}</label>
        <textarea
          #field
          id="idea-body"
          name="body"
          rows="6"
          [attr.maxlength]="maxLength + 50"
          [placeholder]="'ideas.form.placeholder' | transloco"
          [(ngModel)]="body"
          (ngModelChange)="onInput()"
        ></textarea>
        <p class="hint counter" [class.over]="length() > maxLength">{{ length() }} / {{ maxLength }}</p>
      </section>

      @if (error(); as key) {
        <p class="error" role="alert">{{ key | transloco }}</p>
      }

    </form>
  </div>
</ion-content>

<ion-footer class="form-footer">
  <button class="ct-btn save" type="submit" form="idea-form" [disabled]="saving()">
    {{ (saving() ? 'trip.form.saving' : 'ideas.form.save') | transloco }}
  </button>
</ion-footer>
