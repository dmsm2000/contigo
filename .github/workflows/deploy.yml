# Publica a app (pasta app/) no GitHub Pages a cada alteração no ramo master.
# Só corre quando mudam ficheiros do app/ (ou este ficheiro): mexer nas notas não faz deploy.
# Precisa de duas variáveis do repositório (Settings › Secrets and variables › Actions › Variables):
#   SUPABASE_URL  - o endereço do projeto Supabase na nuvem
#   SUPABASE_KEY  - a chave PÚBLICA (publishable/anon). Nunca a chave secreta.
name: Deploy para o GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A app vive na pasta app/: todos os comandos `run` correm lá dentro.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Garante que todos os pacotes vêm do registo público do npm (nunca de um registo de empresa).
      - name: Verificar o registo de pacotes
        run: npm run check:registry

      - run: npm ci

      - name: Testes
        run: npx ng test --watch=false

      - name: Ligar ao Supabase na nuvem
        run: npm run env:production
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}

      - name: Compilar
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # O GitHub Pages não tem regras de rotas: o 404.html faz os links diretos abrirem a app.
      - name: Preparar links diretos
        run: cp dist/contigo/browser/index.html dist/contigo/browser/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist/contigo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
