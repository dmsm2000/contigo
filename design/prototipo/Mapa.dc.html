<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    return dark
      ? { bg: '#0E0C11', sf: '#1A171E', sf2: '#221E27', ln: '#2B2631', tx: '#F6F2F8', mu: '#A89FAE', ac: '#F2649F', ring: '#3A3440', nav: 'rgba(14,12,17,0.86)' }
      : { bg: '#FFFFFF', sf: '#F5F2F6', sf2: '#FFFFFF', ln: '#ECE6EE', tx: '#17121B', mu: '#6C6472', ac: '#C2306F', ring: '#DAD3DE', nav: 'rgba(255,255,255,0.88)' };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const t = this.theme(dark);
    const m = dark
      ? { water: '#0D1E2B', land: '#1D1B22', coast: '#2C2832', park: '#1B2B21', road: '#34303B', border: '#7A3C5E', river: '#173A55', label: '#A89FAE' }
      : { water: '#CFE4EF', land: '#F4F0E8', coast: '#DDD4C4', park: '#DCEBD3', road: '#FFFFFF', border: '#D59AB8', river: '#B8D8EA', label: '#6C6472' };
    const sel = (this.state && this.state.chip) || 0;
    const labels = ['Por ir · 4', 'Já fomos · 5', 'Cabem em dezembro'];
    const chips = labels.map((label, i) => ({
      label,
      bg: i === sel ? t.tx : t.sf2,
      fg: i === sel ? t.bg : t.tx,
      border: i === sel ? t.tx : t.ln,
      pick: () => this.setState({ chip: i })
    }));
    const cards = [
      { name: 'Salamanca', kind: 'salamanca', price: '~183€', meta: 'Porto 18€ · Madrid 15€' },
      { name: 'Coimbra', kind: 'coimbra', price: '~164€', meta: 'Porto 12€ · Madrid 32€' }
    ];
    return {
      t,
      m,
      chips,
      cards,
      grad: 'linear-gradient(135deg, #C2306F 0%, #EE5A62 55%, #F7A55A 100%)'
    };
  }
}
</script>
