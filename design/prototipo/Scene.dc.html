  renderVals() {
    const k = this.props.kind ?? 'salamanca';
    const c = this.props.crop ?? 'center';
    const par = c === 'left' ? 'xMinYMid slice' : c === 'right' ? 'xMaxYMid slice' : 'xMidYMid slice';
    return {
      par,
      isSalamanca: k === 'salamanca',
      isPorto: k === 'porto',
      isAveiro: k === 'aveiro',
      isBraga: k === 'braga',
      isGuimaraes: k === 'guimaraes',

  }
}
