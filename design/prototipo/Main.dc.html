<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    return dark
      ? { bg: '#0E0C11', sf: '#1A171E', ln: '#2B2631', tx: '#F6F2F8', mu: '#A89FAE', ac: '#F2649F', acs: '#3A1428', act: '#FF9DC6', ring: '#3A3440', nav: 'rgba(14,12,17,0.86)' }
      : { bg: '#FFFFFF', sf: '#F5F2F6', ln: '#ECE6EE', tx: '#17121B', mu: '#6C6472', ac: '#C2306F', acs: '#FCE7F0', act: '#8E1F52', ring: '#DAD3DE', nav: 'rgba(255,255,255,0.88)' };
  }
  renderVals() {
    const dark = this.state && typeof this.state.dark === 'boolean' ? this.state.dark : !!this.props.dark;
    const t = this.theme(dark);
    const grad = 'linear-gradient(135deg, #C2306F 0%, #EE5A62 55%, #F7A55A 100%)';
    const stories = [
      { name: 'Aveiro', kind: 'aveiro', ring: grad },
      { name: 'Braga', kind: 'braga', ring: t.ring },
      { name: 'Guimarães', kind: 'guimaraes', ring: t.ring },
      { name: 'Porto', kind: 'porto', ring: t.ring }
    ];
    const months = [];
    for (let i = 0; i < 12; i++) months.push({ bg: i < 5 ? t.ac : t.ring });
    return {
      t,
      dark,
      light: !dark,
      grad,
      heroGrad: 'linear-gradient(125deg, #5E1747 0%, #9E2462 50%, #D8455E 100%)',
      stories,
      months,
      toggle: () => this.setState({ dark: !dark })
    };
  }
}
</script>
