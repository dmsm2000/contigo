<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Nova despesa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #140E18; color: {{t.tx}}">

<div style="position: absolute; inset: 0"><dc-import name="Scene" kind="salamanca" crop="right" hint-size="100%,100%"></dc-import></div>
<div style="position: absolute; inset: 0; background: rgba(10,6,14,0.55)"></div>

<section style="position: absolute; left: 0; right: 0; top: 168px; bottom: 0; background: {{t.bg}}; border-radius: 32px 32px 0 0; padding: 10px 20px 26px; box-sizing: border-box; display: flex; flex-direction: column">
<div style="width: 40px; height: 5px; border-radius: 3px; background: {{t.ring}}; margin: 0 auto 8px"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div>
<h1 style="margin: 0; font-family: Fredoka, Inter, sans-serif; font-weight: 600; font-size: 22px">Nova despesa</h1>
<div style="font-size: 13px; color: {{t.mu}}">Salamanca · Dia 2</div>
</div>
<a href="Viagem.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.sf}}; color: {{t.tx}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</div>

<div style="text-align: center; margin-top: 10px">
<div style="font-family: Fredoka, Inter, sans-serif; font-weight: 600; font-size: 56px; line-height: 1.05; letter-spacing: -1px">{{amount}}<span style="font-size: 32px; color: {{t.mu}}"> €</span></div>
<div style="font-size: 13px; color: {{t.mu}}; margin-top: 2px">Hoje passa a <span style="font-weight: 700; color: {{t.tx}}">{{after}}€</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 56px; border-radius: 18px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 12px Inter, sans-serif; cursor: pointer; padding: 0">
<sc-if value="{{c.isBus}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="13" rx="3"/><path d="M5 11h14M8 20v-3M16 20v-3"/></svg></sc-if>
<sc-if value="{{c.isBed}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></svg></sc-if>
<sc-if value="{{c.isCart}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></sc-if>
<sc-if value="{{c.isFood}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg></sc-if>
<sc-if value="{{c.isTicket}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 8v8" stroke-dasharray="2 2"/></svg></sc-if>
<sc-if value="{{c.isMore}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg></sc-if>
{{c.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 50px; border-radius: 16px; border: none; background: {{t.sf}}; color: {{t.tx}}; font: 600 22px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"/><path d="m12 9 5 5M17 9l-5 5"/></svg></sc-if>
<sc-if value="{{k.isText}}" hint-placeholder-val="{{true}}">{{k.label}}</sc-if>
</button>
</sc-for>
</div>

<a href="Viagem.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #C2306F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg>Guardar {{amount}} €</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    return dark
      ? { bg: '#0E0C11', sf: '#1E1A23', ln: '#2B2631', tx: '#F6F2F8', mu: '#A89FAE', ac: '#F2649F', acs: '#3A1428', act: '#FF9DC6', ring: '#3A3440' }
      : { bg: '#FFFFFF', sf: '#F5F2F6', ln: '#ECE6EE', tx: '#17121B', mu: '#6C6472', ac: '#C2306F', acs: '#FCE7F0', act: '#8E1F52', ring: '#DAD3DE' };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const t = this.theme(dark);
    const s = this.state || {};
    const amount = typeof s.amount === 'string' ? s.amount : '12,40';
    const cat = s.cat || 'cart';
    const value = Number(amount.replace(',', '.')) || 0;
    const after = (23 + value).toFixed(2).replace('.', ',');
    const catDefs = [
      ['bus', 'Transporte'], ['bed', 'Alojamento'], ['cart', 'Supermercado'],
      ['food', 'Restaurante'], ['ticket', 'Atividades'], ['more', 'Outros']
    ];
    const cats = catDefs.map(([id, label]) => ({
      label,
      on: id === cat,
      isBus: id === 'bus', isBed: id === 'bed', isCart: id === 'cart',
      isFood: id === 'food', isTicket: id === 'ticket', isMore: id === 'more',
      bg: id === cat ? t.acs : t.sf,
      fg: id === cat ? t.act : t.tx,
      border: id === cat ? t.ac : 'transparent',
      pick: () => this.setState({ cat: id })
    }));
    const press = (k) => {
      let a = amount;
      if (k === 'back') {
        a = a.slice(0, -1);
        if (!a) a = '0';
      } else if (k === ',') {
        if (a.indexOf(',') === -1) a = a + ',';
      } else if (a === '0') {
        a = k;
      } else {
        const parts = a.split(',');
        if (parts.length === 2 && parts[1].length >= 2) return;
        if (a.replace(',', '').length >= 6) return;
        a = a + k;
      }
      this.setState({ amount: a });
    };
    const keyDefs = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'back'];
    const keys = keyDefs.map((k) => ({
      label: k,
      aria: k === 'back' ? 'Apagar' : k === ',' ? 'Vírgula' : k,
      isBack: k === 'back',
      isText: k !== 'back',
      press: () => press(k)
    }));
    return { t, amount, after, cats, keys };
  }
}
</script>
</body>
</html>
