<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const liked = !!(this.state && this.state.liked);
    return {
      liked,
      likeBg: liked ? '#FFFFFF' : 'rgba(255,255,255,0.14)',
      likeFg: liked ? '#C2306F' : '#FFFFFF',
      likeFill: liked ? 'currentColor' : 'none',
      like: () => this.setState({ liked: !liked })
    };
  }
}
</script>
