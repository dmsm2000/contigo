<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Sorteio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #140E18; color: #FFFFFF">

<div style="position: absolute; inset: 0"><dc-import name="Scene" kind="{{d.kind}}" hint-size="100%,100%"></dc-import></div>
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,8,16,0.45) 0%, rgba(12,8,16,0) 26%, rgba(12,8,16,0.1) 44%, rgba(12,8,16,0.82) 70%, rgba(12,8,16,0.96) 100%)"></div>

<span style="position: absolute; left: 60px; top: 120px; width: 10px; height: 18px; border-radius: 3px; background: #F7A55A; transform: rotate(24deg)"></span>
<span style="position: absolute; left: 118px; top: 84px; width: 8px; height: 14px; border-radius: 3px; background: #FFFFFF; transform: rotate(-30deg)"></span>
<span style="position: absolute; left: 196px; top: 132px; width: 11px; height: 11px; border-radius: 50%; background: #F2649F"></span>
<span style="position: absolute; left: 252px; top: 92px; width: 9px; height: 17px; border-radius: 3px; background: #7FE0A6; transform: rotate(40deg)"></span>
<span style="position: absolute; left: 318px; top: 150px; width: 10px; height: 18px; border-radius: 3px; background: #FFD36E; transform: rotate(-18deg)"></span>
<span style="position: absolute; left: 30px; top: 196px; width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF"></span>
<span style="position: absolute; left: 160px; top: 210px; width: 9px; height: 16px; border-radius: 3px; background: #F2649F; transform: rotate(-52deg)"></span>
<span style="position: absolute; left: 344px; top: 226px; width: 8px; height: 8px; border-radius: 50%; background: #F7A55A"></span>

<div style="position: absolute; left: 16px; right: 16px; top: 14px; display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(20,14,24,0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(20,14,24,0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; font-size: 13px; font-weight: 600">Sorteio de dezembro</span>
<span style="width: 44px"></span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 34px">
<sc-if value="{{retried}}" hint-placeholder-val="{{false}}"><div style="display: inline-block; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 12px; background: rgba(242,100,159,0.25); color: #FFC3DB; margin-bottom: 10px">Veto usado · o destino tentou outra vez</div></sc-if>
<div style="font-size: 15px; font-weight: 600; color: #FFD9E8">O destino falou</div>
<h1 style="margin: 4px 0 18px; font-family: Fredoka, Inter, sans-serif; font-weight: 600; font-size: 46px; line-height: 1.02; letter-spacing: -0.5px">Vamos a {{d.name}}!</h1>

<div style="border-radius: 22px; padding: 14px 16px; background: rgba(28,20,32,0.62); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.14)">
<div style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB4D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>{{d.when}}</div>
<div style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; margin-top: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB4D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="13" rx="3"/><path d="M5 11h14M8 20v-3M16 20v-3"/></svg>{{d.travel}}</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #E8DCE6; margin-top: 14px"><span>Estimativa</span><span style="font-weight: 700; color: #FFFFFF">{{d.est}} de 400€</span></div>
<div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.18); margin-top: 6px; overflow: hidden"><div style="width: {{d.pct}}; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #F2649F, #F7A55A)"></div></div>
</div>

<a href="Viagem.dc.html" style="margin-top: 16px; height: 56px; border-radius: 28px; background: #FFFFFF; color: #17121B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none">Boa, vamos!</a>
<button onClick="{{veto}}" style="margin-top: 10px; width: 100%; height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.10); color: #FFFFFF; font: 600 15px Inter, sans-serif; cursor: pointer">{{vetoLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const i = s.i || 0;
    const vetos = typeof s.vetos === 'number' ? s.vetos : 1;
    const dests = [
      { name: 'Salamanca', kind: 'salamanca', when: 'Sáb 5 – Dom 6 dez · 2 dias', travel: 'Porto 18€ · Madrid 15€', est: '183€', pct: '46%' },
      { name: 'Coimbra', kind: 'coimbra', when: 'Sáb 5 – Dom 6 dez · 2 dias', travel: 'Porto 12€ · Madrid 32€', est: '164€', pct: '41%' }
    ];
    return {
      d: dests[i % dests.length],
      retried: i > 0,
      vetoLabel: vetos > 0 ? 'Usar veto · resta ' + vetos : 'Sem vetos este mês',
      veto: () => {
        if (vetos > 0) this.setState({ i: i + 1, vetos: vetos - 1 });
      }
    };
  }
}
</script>
</body>
</html>
